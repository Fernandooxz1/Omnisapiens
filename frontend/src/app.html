<!doctype html>
<html lang="es" data-accent="blue">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#191724" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Omnisapiens" />
		<!-- El acento se resuelve antes del primer pintado para no parpadear (clave en accent.ts). -->
		<script>
			try {
				var accent = localStorage.getItem('omni-accent');
				if (['blue', 'green', 'orange', 'pink', 'purple'].indexOf(accent) !== -1) {
					document.documentElement.dataset.accent = accent;
				}
			} catch (error) {
				/* sin localStorage queda el acento por defecto */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
