<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Botones Juicy UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #1e272e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      margin: 0;
      font-family: 'Fredoka', sans-serif;
    }

    .juicy-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #ffffff;
      padding: 16px 32px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      user-select: none;

      --bg-top: #2ed573;
      --bg-bottom: #26af61;
      --edge-color: #1b8a4b;

      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.35),
        inset 0 -2px 0 rgba(0, 0, 0, 0.1),
        0 6px 0 var(--edge-color),
        0 10px 15px -3px rgba(0, 0, 0, 0.3);
      text-shadow: 0 2px 0 var(--edge-color);
      transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.08s ease;
    }

    .juicy-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .juicy-btn:active {
      transform: translateY(4px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 2px 0 var(--edge-color),
        0 4px 6px -2px rgba(0, 0, 0, 0.2);
    }

    .juicy-btn--yellow {
      --bg-top: #ffbe26; --bg-bottom: #f39c12; --edge-color: #c87f0a;
    }
    .juicy-btn--purple {
      --bg-top: #a55eea; --bg-bottom: #8854d0; --edge-color: #61359c;
    }
  </style>
</head>
<body>

  <button class="juicy-btn">Jugar Ahora</button>
  <button class="juicy-btn juicy-btn--yellow">Ranking Semanal</button>
  <button class="juicy-btn juicy-btn--purple">Tienda</button>

</body>
</html>
