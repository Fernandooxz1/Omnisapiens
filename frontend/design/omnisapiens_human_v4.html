<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omnisapiens - Human Indie Game UI v4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Fredoka', system-ui, sans-serif;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;

      /* Paleta Pizarra Calida (Sin el azul slate de IA ni radial-gradient) */
      --page-bg: #191724;
      --pattern-dot: rgba(255, 255, 255, 0.04);
      --card-bg: #232033;
      --card-edge: #12101B;
      --panel-bg: #2E2A42;
      --panel-edge: #181524;
      --well-bg: #181523;
      --well-border: #3B3654;
      --text-main: #FFFFFF;
      --text-muted: #9B94B8;

      /* Colores Oficiales Preguntados */
      --green-top: #2CE67C;  --green-bot: #1EC765;  --green-edge: #13964B;
      --blue-top: #2BC0FF;   --blue-bot: #0098E6;   --blue-edge: #006BB3;
      --yellow-top: #FFE135; --yellow-bot: #FFC800; --yellow-edge: #D69E00;
      --orange-top: #FF9E2C; --orange-bot: #FF7800; --orange-edge: #CC5600;
      --pink-top: #FF66B2;   --pink-bot: #EC388B;   --pink-edge: #B51B63;
      --purple-top: #B55FE6; --purple-bot: #9338C6; --purple-edge: #6A1E96;
      --red-top: #FF5242;    --red-bot: #E62514;    --red-edge: #AD1407;

      --avatar-top: var(--blue-top);
      --avatar-bot: var(--blue-bot);
      --avatar-edge: var(--blue-edge);
    }

    body.theme-paper {
      --page-bg: #EAE4D7;
      --pattern-dot: rgba(0, 0, 0, 0.05);
      --card-bg: #F7F4EB;
      --card-edge: #D1C9B8;
      --panel-bg: #FFFFFF;
      --panel-edge: #D8D0C0;
      --well-bg: #E5DEC9;
      --well-border: #CEC5B0;
      --text-main: #231F20;
      --text-muted: #716A5C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--page-bg);
      background-image: radial-gradient(var(--pattern-dot) 2px, transparent 2px);
      background-size: 22px 22px;
      font-family: var(--font-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      transition: background-color 0.25s ease;
    }

    .demo-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--card-edge);
    }
    .demo-bar span {
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .demo-btn {
      font-family: var(--font-display);
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: var(--panel-bg);
      box-shadow: 0 3px 0 var(--panel-edge);
    }
    body.theme-paper .demo-btn {
      color: var(--text-main);
    }
    .demo-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--panel-edge);
    }

    .screens-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 385px));
      gap: 28px;
      width: 100%;
      max-width: 810px;
      justify-content: center;
    }

    .phone-frame {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 22px 20px;
      border: 3px solid var(--panel-bg);
      box-shadow: 0 12px 0 var(--card-edge), 0 22px 35px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 675px;
      position: relative;
    }

    /* ==========================================
       PANTALLA 1: LOBBY HUMANIZADO
    ========================================== */
    .lobby-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .online-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--well-bg);
      padding: 6px 11px;
      border-radius: 99px;
    }
    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-top);
      box-shadow: 0 0 8px var(--green-top);
    }

    .theme-btn {
      background: var(--panel-bg);
      color: var(--text-main);
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-family: var(--font-display);
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--panel-edge);
    }
    .theme-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--panel-edge);
    }

    .logo-wrap {
      text-align: center;
      margin: 22px 0 24px;
      transform: rotate(-2deg);
    }
    .logo-badge-top {
      display: inline-block;
      background: var(--orange-bot);
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 1.2px;
      padding: 3px 10px;
      border-radius: 8px;
      box-shadow: 0 3px 0 var(--orange-edge);
      transform: rotate(3deg) translateY(4px);
      text-transform: uppercase;
    }
    .logo-title {
      font-family: var(--font-display);
      font-size: 2.85rem;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.05;
      text-shadow: 0 5px 0 var(--card-edge);
    }
    .logo-omni { color: var(--text-main); }
    .logo-sapiens {
      color: var(--yellow-bot);
      text-shadow: 0 5px 0 var(--yellow-edge);
    }

    .profile-card {
      background: var(--panel-bg);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 5px 0 var(--panel-edge);
      margin-bottom: 20px;
    }
    .input-well {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--well-bg);
      border: 2px solid var(--well-border);
      border-radius: 15px;
      padding: 8px 12px;
      box-shadow: inset 0 4px 0 rgba(0,0,0,0.35);
    }
    .avatar-preview {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(180deg, var(--avatar-top), var(--avatar-bot));
      box-shadow: 0 3px 0 var(--avatar-edge);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.15rem;
      color: #fff;
      text-shadow: 0 2px 0 var(--avatar-edge);
      flex-shrink: 0;
    }
    .name-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-display);
      font-size: 1.2rem;
      width: 100%;
    }
    .swatches-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 4px;
    }
    .swatches-label {
      font-family: var(--font-display);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .swatches-list {
      display: flex;
      gap: 8px;
    }
    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .swatch.active {
      transform: scale(1.2) translateY(-2px);
      border-color: #fff;
      box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    }

    .modes-stack {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 18px;
    }
    .juicy-mode-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 16px 18px;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        0 6px 0 var(--edge),
        0 10px 18px rgba(0, 0, 0, 0.3);
      transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.08s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .juicy-mode-btn:active {
      transform: translateY(4px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 0 var(--edge);
    }
    .juicy-mode-btn--arcade {
      --bg-top: var(--green-top); --bg-bot: var(--green-bot); --edge: var(--green-edge);
    }
    .juicy-mode-btn--versus {
      --bg-top: var(--blue-top); --bg-bot: var(--blue-bot); --edge: var(--blue-edge);
    }
    .juicy-mode-btn--arcade::after {
      content: "";
      position: absolute;
      top: 0; left: -130%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-25deg);
      animation: sheen 3.5s infinite;
    }
    @keyframes sheen {
      0% { left: -130%; }
      30% { left: 160%; }
      100% { left: 160%; }
    }
    .mode-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 0 var(--edge);
      display: block;
      text-align: left;
    }
    .mode-tag {
      font-size: 0.78rem;
      font-weight: 800;
      opacity: 0.92;
      display: block;
      text-align: left;
    }
    .hearts-pill {
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.18);
      padding: 8px 10px;
      border-radius: 13px;
    }
    .heart-icon {
      width: 17px; height: 17px;
      fill: #fff;
      filter: drop-shadow(0 2px 0 var(--edge));
    }
    .vs-pill {
      background: rgba(0,0,0,0.18);
      padding: 8px 12px;
      border-radius: 13px;
      font-family: var(--font-display);
      font-size: 1rem;
      text-shadow: 0 2px 0 var(--edge);
    }

    .ranking-btn {
      width: 100%;
      background: var(--panel-bg);
      color: var(--text-main);
      border: none;
      border-radius: 16px;
      padding: 13px;
      font-family: var(--font-display);
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--panel-edge);
    }
    .ranking-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--panel-edge);
    }

    /* ==========================================
       PANTALLA 2: PARTIDA 1V1 (4 OPCIONES APILADAS ESTILO PREGUNTADOS)
    ========================================== */
    .game-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .round-capsules {
      display: flex;
      gap: 6px;
    }
    .capsule {
      width: 26px;
      height: 9px;
      border-radius: 6px;
      background: var(--well-bg);
    }
    .capsule.won { background: var(--green-bot); box-shadow: 0 2px 0 var(--green-edge); }
    .capsule.lost { background: var(--red-bot); box-shadow: 0 2px 0 var(--red-edge); }
    .capsule.current {
      background: var(--yellow-bot);
      box-shadow: 0 2px 0 var(--yellow-edge);
    }

    .timer-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--panel-bg);
      padding: 6px 12px;
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 1rem;
      box-shadow: 0 3px 0 var(--panel-edge);
    }
    .timer-pill.danger {
      background: var(--red-bot);
      color: #fff;
      box-shadow: 0 3px 0 var(--red-edge);
    }

    /* MARCADOR ABIERTO (Sin caja rectangular que lo encierre) */
    .open-scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 10px;
      margin-bottom: 6px;
    }
    .duel-player {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .duel-avatar {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: #fff;
    }
    .duel-avatar--p1 {
      background: linear-gradient(180deg, var(--avatar-top), var(--avatar-bot));
      box-shadow: 0 4px 0 var(--avatar-edge);
      text-shadow: 0 2px 0 var(--avatar-edge);
    }
    .duel-avatar--p2 {
      background: linear-gradient(180deg, var(--orange-top), var(--orange-bot));
      box-shadow: 0 4px 0 var(--orange-edge);
      text-shadow: 0 2px 0 var(--orange-edge);
    }
    .crown-svg {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%) rotate(-8deg);
      width: 21px;
      height: 21px;
      fill: var(--yellow-bot);
      filter: drop-shadow(0 2px 0 var(--yellow-edge));
    }
    .duel-name {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      display: block;
    }
    .duel-score {
      font-family: var(--font-display);
      font-size: 1.5rem;
      line-height: 1;
      position: relative;
    }
    .float-plus {
      position: absolute;
      top: -6px;
      right: -42px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--green-top);
      text-shadow: 0 2px 0 var(--green-edge);
      opacity: 0;
      pointer-events: none;
    }
    .float-plus.pop {
      animation: popUp 1s ease-out forwards;
    }
    @keyframes popUp {
      0% { opacity: 1; transform: translateY(4px) scale(0.8); }
      50% { opacity: 1; transform: translateY(-8px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-16px) scale(1); }
    }

    .streak-badge {
      background: linear-gradient(180deg, var(--orange-top), var(--orange-bot));
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.72rem;
      padding: 5px 10px;
      border-radius: 99px;
      box-shadow: 0 3px 0 var(--orange-edge);
      text-shadow: 0 1px 0 var(--orange-edge);
    }

    .time-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--well-bg);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .time-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--green-top);
      border-radius: 99px;
      transition: width 0.25s linear, background 0.25s;
    }

    /* Tarjeta de Pregunta estilo Cartel Fisico (Papel Crema para cortar las cajas oscuras de IA) */
    .question-stage {
      position: relative;
      background: #FFFDF7;
      color: #1E1B2E;
      border-radius: 22px;
      padding: 24px 18px 20px;
      text-align: center;
      box-shadow: 0 6px 0 #CBD5E1, 0 10px 18px rgba(0,0,0,0.22);
      margin-bottom: 14px;
      border: 2px solid #E2E8F0;
    }
    .cat-pill-center {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(180deg, var(--green-top), var(--green-bot));
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.74rem;
      letter-spacing: 0.8px;
      padding: 5px 14px;
      border-radius: 99px;
      box-shadow: 0 3px 0 var(--green-edge);
      text-shadow: 0 1px 0 var(--green-edge);
      text-transform: uppercase;
    }
    .question-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      line-height: 1.3;
      color: #1E1B2E;
    }

    /* LISTA VERTICAL DE 4 BARRAS (1x4 clasico de Preguntados para que entren textos largos) */
    .answers-stack-1x4 {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .answer-bar-btn {
      position: relative;
      width: 100%;
      background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
      border: 2px solid #E2E8F0;
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1E293B;
      font-family: var(--font-display);
      font-size: 1.15rem;
      box-shadow: 0 5px 0 #CBD5E1, 0 7px 12px rgba(0, 0, 0, 0.16);
      transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.08s;
    }
    .answer-bar-btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    .answer-bar-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #CBD5E1;
    }

    /* Tecla 3D izquierda con color para que no parezca un input plano */
    .bar-key {
      position: absolute;
      left: 12px;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(180deg, var(--blue-top), var(--blue-bot));
      box-shadow: 0 2px 0 var(--blue-edge);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      color: #FFFFFF;
      text-shadow: 0 1px 0 var(--blue-edge);
    }

    /* Estados de las barras */
    .answer-bar-btn.is-suspense {
      background: linear-gradient(180deg, var(--yellow-top), var(--yellow-bot));
      border-color: var(--yellow-top);
      color: #fff;
      text-shadow: 0 2px 0 var(--yellow-edge);
      box-shadow: 0 5px 0 var(--yellow-edge);
      transform: scale(1.015);
    }
    .answer-bar-btn.is-suspense .bar-key {
      background: rgba(0,0,0,0.18); box-shadow: none; color: #fff;
    }
    .answer-bar-btn.is-correct {
      background: linear-gradient(180deg, var(--green-top), var(--green-bot));
      border-color: var(--green-top);
      color: #fff;
      text-shadow: 0 2px 0 var(--green-edge);
      box-shadow: 0 5px 0 var(--green-edge);
    }
    .answer-bar-btn.is-correct .bar-key {
      background: rgba(0,0,0,0.18); box-shadow: none; color: #fff;
    }
    .answer-bar-btn.is-wrong {
      background: linear-gradient(180deg, var(--red-top), var(--red-bot));
      border-color: var(--red-top);
      color: #fff;
      text-shadow: 0 2px 0 var(--red-edge);
      box-shadow: 0 5px 0 var(--red-edge);
      animation: shake 0.35s ease;
    }
    .answer-bar-btn.is-wrong .bar-key {
      background: rgba(0,0,0,0.18); box-shadow: none; color: #fff;
    }
    .answer-bar-btn.is-eliminated {
      opacity: 0.25;
      pointer-events: none;
      transform: translateY(3px);
      box-shadow: 0 2px 0 #CBD5E1;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }

    /* Footer de Partida con Comodin */
    .game-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bomb-btn {
      background: linear-gradient(180deg, var(--purple-top), var(--purple-bot));
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 10px 15px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 4px 0 var(--purple-edge);
      text-shadow: 0 1px 0 var(--purple-edge);
    }
    .bomb-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--purple-edge);
    }
    .bomb-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .shortcut-label {
      font-family: var(--font-display);
      font-size: 0.76rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="demo-bar">
    <span>VERSIÓN 4 BARRAS APILADAS (1x4 CLÁSICO PREGUNTADOS):</span>
    <button class="demo-btn" onclick="resetGame()">Reiniciar Ronda</button>
    <button class="demo-btn" onclick="toggleTheme()">Alternar Papel / Oscuro</button>
  </div>

  <div class="screens-grid">

    <!-- PANTALLA 1: LOBBY -->
    <section class="phone-frame">
      <div>
        <div class="lobby-header">
          <div class="online-pill">
            <span class="online-dot"></span>
            <span>128 jugando</span>
          </div>
          <button class="theme-btn" onclick="toggleTheme()" id="themeLabel">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"></path>
            </svg>
            <span>PAPEL</span>
          </button>
        </div>

        <div class="logo-wrap">
          <span class="logo-badge-top">EDICIÓN DUELO</span>
          <h1 class="logo-title">
            <span class="logo-omni">Omni</span><span class="logo-sapiens">sapiens</span>
          </h1>
        </div>

        <div class="profile-card">
          <div class="input-well">
            <div class="avatar-preview" id="lobbyInitial">F</div>
            <input
              type="text"
              class="name-input"
              value="Facu"
              maxlength="12"
              placeholder="Tu apodo..."
              oninput="updatePlayerName(this.value)"
            />
          </div>
          <div class="swatches-bar">
            <span class="swatches-label">Tu color</span>
            <div class="swatches-list">
              <button class="swatch active" style="background:#0098E6" onclick="pickColor('blue', this)"></button>
              <button class="swatch" style="background:#1EC765" onclick="pickColor('green', this)"></button>
              <button class="swatch" style="background:#FF7800" onclick="pickColor('orange', this)"></button>
              <button class="swatch" style="background:#EC388B" onclick="pickColor('pink', this)"></button>
              <button class="swatch" style="background:#9338C6" onclick="pickColor('purple', this)"></button>
            </div>
          </div>
        </div>

        <div class="modes-stack">
          <button class="juicy-mode-btn juicy-mode-btn--arcade" onclick="beep(520)">
            <div>
              <span class="mode-title">ARCADE</span>
              <span class="mode-tag">Supervivencia</span>
            </div>
            <div class="hearts-pill">
              <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <svg class="heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
          </button>

          <button class="juicy-mode-btn juicy-mode-btn--versus" onclick="beep(440)">
            <div>
              <span class="mode-title">DUELO 1V1</span>
              <span class="mode-tag">Crear sala o código</span>
            </div>
            <div class="vs-pill">VS</div>
          </button>
        </div>
      </div>

      <button class="ranking-btn" onclick="beep(380)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFC800">
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" stroke="#FFC800" stroke-width="2.5" fill="none"></path>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" stroke="#FFC800" stroke-width="2.5" fill="none"></path>
          <path d="M4 22h16" stroke="#FFC800" stroke-width="2.5" stroke-linecap="round"></path>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22h10c0-1.76-.85-3.25-2.03-3.79-.5-.23-.97-.66-.97-1.21v-2.34"></path>
        </svg>
        <span>Ranking de la Semana</span>
      </button>
    </section>

    <!-- PANTALLA 2: PARTIDA 1V1 -->
    <section class="phone-frame">
      <div>
        <div class="game-top-bar">
          <div class="round-capsules">
            <div class="capsule won"></div>
            <div class="capsule lost"></div>
            <div class="capsule current" id="round3Dot"></div>
            <div class="capsule"></div>
            <div class="capsule"></div>
          </div>

          <div class="timer-pill" id="timerPill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="timerSec">15s</span>
          </div>
        </div>

        <!-- Marcador Abierto (Sin caja gris tipo formulario) -->
        <div class="open-scoreboard">
          <div class="duel-player">
            <div class="duel-avatar duel-avatar--p1">
              <svg class="crown-svg" viewBox="0 0 24 24"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v2H5v-2z"/></svg>
              <span id="gameInitial">F</span>
            </div>
            <div>
              <span class="duel-name" id="gameName">FACU</span>
              <div class="duel-score">
                <span id="scoreVal">348</span>
                <span class="float-plus" id="floatPlus">+52</span>
              </div>
            </div>
          </div>

          <div class="streak-badge" id="streakBadge">RACHA x2</div>

          <div class="duel-player" style="text-align: right;">
            <div>
              <span class="duel-name">TOMI</span>
              <div class="duel-score">296</div>
            </div>
            <div class="duel-avatar duel-avatar--p2">T</div>
          </div>
        </div>

        <div class="time-bar-bg">
          <div class="time-bar-fill" id="timeBarFill"></div>
        </div>

        <!-- Tarjeta de pregunta en blanco calido como el Preguntados original -->
        <div class="question-stage">
          <div class="cat-pill-center">Ciencia</div>
          <p class="question-title">¿Cuál es el símbolo químico del oro?</p>
        </div>

        <!-- 4 Barras Verticales Apiladas (1x4 Clasico de Preguntados) -->
        <div class="answers-stack-1x4">
          <button class="answer-bar-btn" data-correct="true" onclick="pickAnswer(this)">
            <span class="bar-key">1</span>
            <span>AU</span>
          </button>
          <button class="answer-bar-btn" data-correct="false" onclick="pickAnswer(this)">
            <span class="bar-key">2</span>
            <span>AG</span>
          </button>
          <button class="answer-bar-btn" data-correct="false" onclick="pickAnswer(this)">
            <span class="bar-key">3</span>
            <span>FE</span>
          </button>
          <button class="answer-bar-btn" data-correct="false" onclick="pickAnswer(this)">
            <span class="bar-key">4</span>
            <span>OR</span>
          </button>
        </div>
      </div>

      <div class="game-bottom">
        <button class="bomb-btn" id="bombBtn" onclick="triggerFiftyFifty()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <circle cx="11" cy="13" r="8"></circle>
            <path d="M19 5l-3 3"></path>
            <path d="M15 2l2 2"></path>
          </svg>
          <span>50 / 50</span>
        </button>
        <span class="shortcut-label">Teclas [1-4]</span>
      </div>
    </section>

  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 480, dur = 0.07) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.3, audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    function updatePlayerName(val) {
      const clean = val.trim() || 'Facu';
      const ch = clean.charAt(0).toUpperCase();
      document.getElementById('lobbyInitial').textContent = ch;
      document.getElementById('gameInitial').textContent = ch;
      document.getElementById('gameName').textContent = clean.toUpperCase();
    }

    const colors = {
      blue:   { top: '#2BC0FF', bot: '#0098E6', edge: '#006BB3' },
      green:  { top: '#2CE67C', bot: '#1EC765', edge: '#13964B' },
      orange: { top: '#FF9E2C', bot: '#FF7800', edge: '#CC5600' },
      pink:   { top: '#FF66B2', bot: '#EC388B', edge: '#B51B63' },
      purple: { top: '#B55FE6', bot: '#9338C6', edge: '#6A1E96' }
    };

    function pickColor(key, btn) {
      beep(550);
      const c = colors[key];
      document.documentElement.style.setProperty('--avatar-top', c.top);
      document.documentElement.style.setProperty('--avatar-bot', c.bot);
      document.documentElement.style.setProperty('--avatar-edge', c.edge);
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
    }

    function toggleTheme() {
      beep(420);
      document.body.classList.toggle('theme-paper');
      const isPaper = document.body.classList.contains('theme-paper');
      document.querySelector('#themeLabel span').textContent = isPaper ? 'OSCURO' : 'PAPEL';
    }

    let sec = 15;
    let timer = null;
    let locked = false;
    let score = 348;
    let streak = 2;

    function startClock() {
      clearInterval(timer);
      sec = 15;
      renderClock();
      timer = setInterval(() => {
        if (locked) return;
        sec--;
        renderClock();
        if (sec <= 0) {
          clearInterval(timer);
          locked = true;
          showCorrectAnswer();
        }
      }, 1000);
    }

    function renderClock() {
      document.getElementById('timerSec').textContent = sec + 's';
      const fill = document.getElementById('timeBarFill');
      const pill = document.getElementById('timerPill');
      fill.style.width = ((sec / 15) * 100) + '%';

      if (sec > 8) {
        fill.style.background = 'var(--green-top)';
        pill.classList.remove('danger');
      } else if (sec > 4) {
        fill.style.background = 'var(--yellow-bot)';
        pill.classList.remove('danger');
      } else {
        fill.style.background = 'var(--red-top)';
        pill.classList.add('danger');
      }
    }

    function pickAnswer(btn) {
      if (locked) return;
      locked = true;
      clearInterval(timer);
      document.querySelectorAll('.answer-bar-btn').forEach(b => b.disabled = true);

      btn.classList.add('is-suspense');
      beep(400, 0.09);

      setTimeout(() => {
        btn.classList.remove('is-suspense');
        const ok = btn.getAttribute('data-correct') === 'true';
        const dot = document.getElementById('round3Dot');
        dot.classList.remove('current');

        if (ok) {
          btn.classList.add('is-correct');
          dot.classList.add('won');
          beep(680, 0.15);
          score += 52;
          document.getElementById('scoreVal').textContent = score;
          const fp = document.getElementById('floatPlus');
          fp.classList.remove('pop');
          void fp.offsetWidth;
          fp.classList.add('pop');
          streak++;
          document.getElementById('streakBadge').textContent = 'RACHA x' + streak;
        } else {
          btn.classList.add('is-wrong');
          dot.classList.add('lost');
          beep(220, 0.22);
          streak = 0;
          document.getElementById('streakBadge').textContent = 'SIN RACHA';
          showCorrectAnswer();
        }
      }, 450);
    }

    function showCorrectAnswer() {
      document.querySelectorAll('.answer-bar-btn').forEach(b => {
        if (b.getAttribute('data-correct') === 'true') b.classList.add('is-correct');
      });
    }

    function triggerFiftyFifty() {
      if (locked) return;
      beep(600, 0.1);
      const wrongs = Array.from(document.querySelectorAll('.answer-bar-btn[data-correct="false"]'));
      wrongs.slice(0, 2).forEach(b => {
        b.classList.add('is-eliminated');
        b.disabled = true;
      });
      document.getElementById('bombBtn').disabled = true;
    }

    function resetGame() {
      beep(500);
      locked = false;
      document.getElementById('bombBtn').disabled = false;
      document.getElementById('round3Dot').className = 'capsule current';
      document.querySelectorAll('.answer-bar-btn').forEach(b => {
        b.disabled = false;
        b.className = 'answer-bar-btn';
      });
      startClock();
    }

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;
      const idx = parseInt(e.key, 10) - 1;
      const btns = document.querySelectorAll('.answer-bar-btn');
      if (idx >= 0 && idx < btns.length && !btns[idx].disabled) {
        pickAnswer(btns[idx]);
      }
    });

    startClock();
  </script>
</body>
</html>
