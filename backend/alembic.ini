# La URL de la base no está acá a propósito: sale de .env vía
# app.config.settings (ver alembic/env.py). Una sola fuente de verdad.

[alembic]
script_location = alembic

# Los ids de revisión se pasan a mano con --rev-id (0001, 0002, ...): se leen
# como el V1__/V2__ de Flyway. El orden no depende del nombre sino de
# down_revision, así que el template solo arma un nombre legible.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
