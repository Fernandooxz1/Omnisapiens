[project]
name = "omnisapiens-backend"
version = "0.1.0"
description = "API del juego de trivia Omnisapiens (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "redis",
    "pyjwt",
    "python-multipart",
    "orjson",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.ruff.lint.isort]
# Sin esto ruff ve la carpeta alembic/ y trata al paquete `alembic` como
# código propio, mezclándolo con app.* en el bloque de imports locales.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Un solo event loop para toda la sesión: si las fixtures corrieran en el loop
# de sesión y los tests en uno por test, asyncpg fallaría con loops cruzados.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
